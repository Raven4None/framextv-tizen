<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FrameXTV — Smart TV Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #07070a;
      --surface: #121218;
      --surface-hover: #1d1d26;
      --accent: #14f195;
      --accent-glow: rgba(20, 241, 149, 0.35);
      --text: #f4f4f6;
      --muted: #9ca3af;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    /* Top Navbar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 56px;
      background: linear-gradient(180deg, rgba(7,7,10,0.95) 0%, rgba(7,7,10,0) 100%);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-badge {
      background: var(--accent);
      color: #000;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .nav-tabs {
      display: flex;
      gap: 16px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 2px solid transparent;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .nav-btn.active {
      background: rgba(20, 241, 149, 0.15);
      color: var(--accent);
    }
    .focusable.focused {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px var(--accent-glow), 0 12px 28px rgba(0,0,0,0.7);
      transform: scale(1.05);
      outline: none;
      z-index: 5;
    }
    .status-pills {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .pill {
      background: rgba(255,255,255,0.06);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Main Content */
    main {
      padding: 110px 56px 48px;
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .search-bar {
      display: none;
      margin-bottom: 24px;
      gap: 12px;
    }
    .search-bar.visible {
      display: flex;
    }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 2px solid rgba(255,255,255,0.12);
      color: var(--text);
      font-size: 22px;
      padding: 14px 22px;
      border-radius: 12px;
    }
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #e4e4e7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 22px;
      padding-bottom: 80px;
    }
    .card {
      background: var(--surface);
      border: 3px solid transparent;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 2 / 3;
      transition: transform 0.16s ease, border-color 0.16s ease;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }
    .card-meta {
      font-size: 13px;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Detail & Server Picker Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 8, 0.94);
      z-index: 50;
      display: none;
      padding: 64px 80px;
      gap: 48px;
      align-items: center;
    }
    .modal.open { display: flex; }
    .modal-poster {
      width: 320px;
      border-radius: 18px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.8);
      flex-shrink: 0;
    }
    .modal-body {
      flex: 1;
      max-height: 85vh;
      overflow-y: auto;
      padding-right: 16px;
    }
    .modal-title { font-size: 40px; font-weight: 800; margin-bottom: 10px; }
    .modal-sub { color: var(--accent); font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .modal-desc { color: var(--muted); font-size: 18px; line-height: 1.5; margin-bottom: 28px; max-width: 900px; }
    .streams-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stream-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 24px;
      color: var(--text);
      text-align: left;
      font-size: 18px;
      cursor: pointer;
    }
    .stream-badge {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* Fullscreen Player */
    .player-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
    }
    .player-screen.open { display: block; }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    video::cue {
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 1.35em;
      font-family: system-ui, sans-serif;
    }
    .player-hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 56px;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.85) 100%);
      transition: opacity 0.25s ease;
    }
    .player-hud.hidden { opacity: 0; pointer-events: none; }
    .hud-top { display: flex; justify-content: space-between; align-items: center; }
    .hud-title { font-size: 26px; font-weight: 800; }
    .hud-info { color: var(--accent); font-size: 16px; font-weight: 600; margin-top: 4px; }
    .hud-controls { display: flex; gap: 14px; align-items: center; }
    .hud-btn {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>FrameXTV</span>
      <span class="brand-badge">4K Smart TV</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn focusable active" data-action="tab" data-tab="movie">🎬 Películas</button>
      <button class="nav-btn focusable" data-action="tab" data-tab="series">📺 Series</button>
      <button class="nav-btn focusable" data-action="tab" data-tab="search">🔍 Buscar</button>
    </div>
    <div class="status-pills">
      <span class="pill">🇺🇸 Audio: EN Priority</span>
      <span class="pill">🇲🇽 Subs: LATAM Auto</span>
      <span class="pill">🚫 Block ≤480p / CAM</span>
      <span class="pill">⚡ Auto-Fastest TTFB</span>
    </div>
  </header>

  <main id="catalogView">
    <div id="searchBar" class="search-bar">
      <input id="searchInput" class="search-input focusable" type="text" placeholder="Escribe el título y presiona Enter..." />
      <button class="nav-btn focusable" data-action="run-search">Buscar</button>
    </div>
    <h2 id="sectionHeading" class="section-title">Tendencias en Películas</h2>
    <div id="catalogGrid" class="grid"></div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal">
    <img id="modalPoster" class="modal-poster" src="" alt="" />
    <div class="modal-body">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalSub" class="modal-sub"></div>
      <div id="modalDesc" class="modal-desc"></div>
      <div id="streamsContainer" class="streams-list"></div>
    </div>
  </div>

  <!-- Video Player -->
  <div id="playerScreen" class="player-screen">
    <video id="videoEl" playsinline crossorigin="anonymous"></video>
    <div id="playerHud" class="player-hud">
      <div class="hud-top">
        <div>
          <div id="hudTitle" class="hud-title"></div>
          <div id="hudInfo" class="hud-info"></div>
        </div>
        <div class="hud-controls">
          <button class="hud-btn focusable" data-action="player-toggle">⏯ Play / Pause</button>
          <button class="hud-btn focusable" data-action="player-next-server">⚡ Cambiar Servidor</button>
          <button class="hud-btn focusable" data-action="player-close">✖ Salir (Back)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/tv/tv-app.js"></script>
</body>
</html>
